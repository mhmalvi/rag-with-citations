<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the documents - rag-with-citations</title>
<style>
  :root { --ink:#1b2230; --muted:#5d6676; --line:#e2e6ec; --bg:#f5f6f8; --accent:#2747c7; --accent-soft:#e9edfb;
          --ok:#12703a; --ok-soft:#e5f4ea; --bad:#a3261d; --bad-soft:#fbe9e7; --mark:#ffe58a; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); }
  .bar { max-width:1240px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:12px; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; }
  .bar h1 { font-size:17px; margin:0; } .bar span { color:var(--muted); font-size:13px; }
  main { max-width:1240px; margin:0 auto; padding:24px; display:grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap:22px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; }
  form { display:flex; gap:10px; }
  input[type=text] { flex:1; font:inherit; padding:11px 14px; border:1px solid #cdd3dc; border-radius:9px; outline:none; }
  input[type=text]:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button.primary { font:inherit; font-weight:600; padding:0 18px; border:0; border-radius:9px; background:var(--accent); color:#fff; cursor:pointer; }
  button.primary:disabled { opacity:.6; cursor:progress; }
  .examples { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { font:inherit; font-size:12.5px; border:1px solid var(--line); background:#fafbfc; border-radius:999px; padding:4px 10px; cursor:pointer; color:var(--muted); }
  .examples button:hover { border-color:var(--accent); color:var(--accent); }
  .label { font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:18px 0 8px; }
  .answer { font-size:16px; white-space:pre-wrap; }
  .cite { display:inline-block; min-width:22px; padding:0 5px; margin:0 1px; border-radius:6px; border:0; font:600 12px/20px inherit;
          vertical-align:1px; background:var(--accent-soft); color:var(--accent); cursor:pointer; }
  .cite.active { background:var(--accent); color:#fff; } .cite.unverified { background:var(--bad-soft); color:var(--bad); }
  .abstain { background:#f1f3f6; border:1px dashed #c3c9d3; border-radius:10px; padding:12px 14px; }
  .abstain b { display:block; margin-bottom:2px; }
  .clist { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
  .clist li { border:1px solid var(--line); border-radius:10px; padding:9px 12px; cursor:pointer; }
  .clist li:hover, .clist li.active { border-color:var(--accent); background:#fbfcff; }
  .clist .q { color:var(--muted); font-size:13.5px; }
  .badge { display:inline-block; font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:999px; margin-left:6px; }
  .badge.ok { background:var(--ok-soft); color:var(--ok); } .badge.bad { background:var(--bad-soft); color:var(--bad); }
  aside .doc { font-weight:650; font-size:15.5px; } aside .loc { color:var(--muted); font-size:13.5px; margin-top:2px; }
  aside a { color:var(--accent); font-size:13.5px; }
  .snippet { margin-top:12px; padding:14px 16px; background:#fbfbfa; border:1px solid var(--line); border-radius:10px; white-space:pre-wrap;
             font-size:14px; line-height:1.6; max-height:520px; overflow:auto; }
  mark { background:var(--mark); padding:1px 0; border-radius:3px; box-shadow:0 0 0 2px var(--mark); }
  .empty { color:var(--muted); font-size:14px; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:14px; }
  details.passages summary { cursor:pointer; color:var(--muted); font-size:13px; }
  details.passages ol { padding-left:18px; font-size:13px; color:var(--muted); }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><div class="bar"><div class="logo">R</div><h1>Ask the documents</h1>
  <span>Hybrid search + reranking, answered by Claude, every quote checked against the source page</span></div></header>
<main>
  <section>
    <div class="card">
      <form id="ask"><input id="q" type="text" maxlength="500" autocomplete="off" placeholder="Ask a question about the documents..." required>
        <button class="primary" id="go" type="submit">Ask</button></form>
      <div class="examples" id="examples"></div>
    </div>
    <div class="card" id="result" style="margin-top:16px"><p class="empty">Answers appear here, with numbered citations you can click.</p></div>
  </section>
  <aside class="card" id="source"><p class="empty">Click a citation to see the exact passage it comes from, with the quoted words highlighted.</p></aside>
</main>
<script>
const EXAMPLES = ["How many days of holiday can I carry over?", "What are the six Functions of the NIST CSF 2.0 Core?",
  "When do I need a fit note for sick leave?", "What is the National Minimum Wage for workers aged 21 and over?"];
const $ = (id) => document.getElementById(id);
let current = null;

function esc(text) { const d = document.createElement("div"); d.textContent = text; return d.innerHTML; }

function renderAnswerText(answer) {
  const byNumber = Object.fromEntries(answer.citations.map(c => [c.number, c]));
  return esc(answer.text).replace(/\[(\d+)\]/g, (m, n) => {
    const c = byNumber[n]; if (!c) return m;
    return `<button class="cite${c.verified ? "" : " unverified"}" data-n="${n}" title="${esc(c.title)}, ${esc(c.location)}">${n}</button>`;
  });
}

function renderCitationList(answer) {
  return answer.citations.map(c => `<li data-n="${c.number}"><b>[${c.number}]</b> ${esc(c.title)}
    <span class="badge ${c.verified ? "ok" : "bad"}">${c.verified ? "quote verified" : "quote not found"}</span>
    <div class="q">${esc(c.location)} &middot; &ldquo;${esc(c.quote)}&rdquo;</div></li>`).join("");
}

function renderResult(answer) {
  current = answer;
  const passages = answer.passages.map(p => `<li>${esc(p.title)} &middot; ${esc(p.location)} (score ${p.score.toFixed(2)})</li>`).join("");
  const body = answer.abstained
    ? `<div class="abstain"><b>Not in the documents</b>${esc(answer.text)}</div>`
    : `<div class="answer">${renderAnswerText(answer)}</div><div class="label">Sources</div><ul class="clist">${renderCitationList(answer)}</ul>`;
  const verified = answer.citations.filter(c => c.verified).length;
  $("result").innerHTML = `<div class="label" style="margin-top:0">Question</div><div>${esc(answer.question)}</div>
    <div class="label">Answer</div>${body}
    <div class="meta">${answer.abstained ? "Abstained" : `${verified} of ${answer.citations.length} citations verified`} &middot; ${esc(answer.model)}</div>
    <details class="passages"><summary>${answer.passages.length} passages retrieved</summary><ol>${passages}</ol></details>`;
  if (!answer.abstained && answer.citations.length) showSource(answer.citations[0].number);
  else $("source").innerHTML = `<p class="empty">No citation to show.</p>`;
}

function highlighted(text, span) {
  if (!span) return esc(text);
  const [start, end] = span;
  return esc(text.slice(0, start)) + "<mark id=hl>" + esc(text.slice(start, end)) + "</mark>" + esc(text.slice(end));
}

function showSource(number) {
  const c = current.citations.find(x => x.number === Number(number));
  const p = current.passages[c.source - 1]; if (!p) return;
  document.querySelectorAll("[data-n]").forEach(el => el.classList.toggle("active", el.dataset.n == number));
  const page = p.page ? `#page=${p.page}` : "";
  $("source").innerHTML = `<div class="label" style="margin-top:0">Citation [${c.number}]
      <span class="badge ${c.verified ? "ok" : "bad"}">${c.verified ? "quote found on this " + (p.page ? "page" : "section") : "quote not found"}</span></div>
    <div class="doc">${esc(p.title)}</div><div class="loc">${esc(p.location)}${p.page && p.section ? " &middot; " + esc(p.section) : ""}</div>
    <a href="/api/documents/${encodeURIComponent(p.doc_id)}/file${page}" target="_blank" rel="noopener">Open original document</a>
    <div class="snippet">${highlighted(p.text, c.highlight)}</div>`;
  const mark = document.getElementById("hl"); if (mark) mark.scrollIntoView({block: "center"});
}

async function ask(question) {
  $("q").value = question; $("go").disabled = true;
  $("result").innerHTML = `<p class="empty">Searching the documents and asking Claude...</p>`;
  try {
    const res = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({question})});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    renderResult(await res.json());
  } catch (err) { $("result").innerHTML = `<p class="empty">Something went wrong: ${esc(err.message)}</p>`; }
  finally { $("go").disabled = false; }
}

$("ask").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value.trim()); });
$("result").addEventListener("click", (e) => { const t = e.target.closest("[data-n]"); if (t) showSource(t.dataset.n); });
$("examples").innerHTML = EXAMPLES.map(q => `<button type="button">${esc(q)}</button>`).join("");
$("examples").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
const initial = new URLSearchParams(location.search).get("q"); if (initial) ask(initial);
</script>
</body>
</html>
