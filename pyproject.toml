[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-with-citations"
version = "0.1.0"
description = "Chat with your documents: hybrid retrieval, reranking, Claude answers with verified inline citations, and an eval suite."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Muhammad H.M. Alvi" }]
dependencies = [
    "anthropic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=5.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface_hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]
screenshots = ["playwright>=1.45"]

[project.scripts]
ragcite = "ragcite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragcite = ["web/static/*", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]
